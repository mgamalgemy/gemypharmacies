<!DOCTYPE html><html lang="ar" dir="rtl"><head>  <meta charset="UTF-8"/>  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>  <title>صيدليات جيمي – قريباً | Gemy Pharmacies – Coming Soon</title>  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&family=Tajawal:wght@300;400;700;900&family=DM+Sans:wght@300;400;600;700;900&display=swap" rel="stylesheet"/>  <style>    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {      --orange:      #F7921E;      --orange-light:#FFA940;      --orange-dim:  rgba(247,146,30,0.15);      --black:       #080808;      --white:       #FAFAFA;    }
    /* ── Base ── */    html {      scroll-behavior: smooth;    }    body {      min-height: 100vh;      background: var(--black);      color: var(--white);      /* Allow scrolling on small screens — no overflow:hidden */      overflow-x: hidden;    }    html[lang="ar"] body { font-family: 'Cairo', 'Tajawal', sans-serif; }    html[lang="en"] body { font-family: 'DM Sans', sans-serif; }
    /* ── Background (fixed so it covers scroll) ── */    .bg {      position: fixed; inset: 0; z-index: 0; pointer-events: none;      background:        radial-gradient(ellipse 80% 60% at 70% 20%, rgba(247,146,30,0.08) 0%, transparent 60%),        radial-gradient(ellipse 60% 80% at 20% 90%, rgba(247,146,30,0.05) 0%, transparent 55%),        var(--black);    }    .bg::after {      content: ''; position: absolute; inset: 0;      background-image:        repeating-linear-gradient(0deg,  transparent, transparent 40px, rgba(247,146,30,0.025) 40px, rgba(247,146,30,0.025) 41px),        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(247,146,30,0.025) 40px, rgba(247,146,30,0.025) 41px);    }
    /* ── Orbs ── */    .orb { position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.18; pointer-events: none; animation: drift 12s ease-in-out infinite alternate; }    .orb1 { width: 500px; height: 500px; background: var(--orange);       top: -15%; right: -10%; animation-duration: 14s; }    .orb2 { width: 350px; height: 350px; background: var(--orange-light); bottom: -10%; left: -8%; animation-duration: 10s; animation-delay: -4s; }    @keyframes drift { from{transform:translate(0,0) scale(1);} to{transform:translate(30px,20px) scale(1.08);} }
    /* ── Language switcher ── */    .lang-switcher {      position: fixed; top: 1.2rem; left: 1.2rem; z-index: 200;      display: flex; align-items: center;      background: rgba(10,10,10,0.7);      border: 1px solid rgba(247,146,30,0.3);      border-radius: 100px; padding: 4px;      backdrop-filter: blur(14px);      -webkit-backdrop-filter: blur(14px);      animation: fadeUp 0.9s 0.1s ease both;    }    html[lang="en"] .lang-switcher { left: auto; right: 1.2rem; }
    .lang-btn {      background: transparent; border: none; cursor: pointer;      color: rgba(250,250,250,0.45);      font-size: 0.75rem; font-weight: 700;      padding: 5px 13px; border-radius: 100px;      transition: color 0.25s, background 0.25s;      letter-spacing: 0.04em; line-height: 1;      touch-action: manipulation;    }    html[lang="ar"] .lang-btn { font-family: 'Cairo', sans-serif; }    html[lang="en"] .lang-btn { font-family: 'DM Sans', sans-serif; }    .lang-btn.active { background: var(--orange); color: #fff; }    .lang-btn:hover:not(.active) { color: var(--orange-light); }
    /* ── Page wrapper: scrollable column ── */    .page {      position: relative; z-index: 1;      min-height: 100vh;      display: flex; flex-direction: column;      align-items: center;      /* top padding clears the fixed lang switcher; bottom padding replaces fixed footer */      padding: 5rem 1.5rem 4rem;      max-width: 1200px;      margin: 0 auto;      text-align: center;      gap: 0;    }
    /* Center vertically only when content fits the viewport */    @media (min-height: 640px) {      .page { justify-content: center; }    }
    /* ── Logo ── */    .logo-wrap { display: flex; justify-content: center; width: 100%; margin-bottom: 2rem; }    .logo-wrap img {      width: clamp(110px, 15vw, 160px);      height: auto;      filter: drop-shadow(0 0 26px rgba(247,146,30,0.45));    }
    /* ── Badge ── */    .badge {      display: inline-flex; align-items: center; gap: 8px;      background: var(--orange-dim);      border: 1px solid rgba(247,146,30,0.35);      border-radius: 100px; padding: 5px 18px;      font-size: 0.72rem; font-weight: 600;      letter-spacing: 0.12em; color: var(--orange-light);      text-transform: uppercase;      animation: fadeUp 0.9s 0.15s ease both;      margin-bottom: 1.2rem;    }    .badge-dot {      width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;      background: var(--orange); animation: pulse 1.8s ease-in-out infinite;    }    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1);} 50%{opacity:.4;transform:scale(.7);} }
    /* ── Headline ── */    h1 {      font-size: clamp(1.9rem, 7vw, 4.5rem); font-weight: 900;      line-height: 1.2; text-align: center;      animation: fadeUp 0.9s 0.25s ease both; margin-bottom: 1rem;    }    html[lang="ar"] h1 { font-family: 'Cairo', sans-serif; }    html[lang="en"] h1 { font-family: 'DM Sans', sans-serif; }    h1 span { color: var(--orange); }
    /* ── Sub ── */    .sub {      font-size: clamp(0.88rem, 3.5vw, 1.1rem); font-weight: 300;      color: rgba(250,250,250,0.55); text-align: center;      max-width: 420px; line-height: 1.85;      animation: fadeUp 0.9s 0.35s ease both; margin-bottom: 2rem;    }
    /* ── Form ── */    .form-wrap {      width: 100%; max-width: 460px;      animation: fadeUp 0.9s 0.45s ease both;    }    .input-row {      display: flex;      border-radius: 14px; overflow: hidden;      border: 1.5px solid rgba(247,146,30,0.3);      background: rgba(255,255,255,0.04);      backdrop-filter: blur(10px);      transition: border-color 0.3s, box-shadow 0.3s;    }    .input-row:focus-within {      border-color: var(--orange);      box-shadow: 0 0 0 4px rgba(247,146,30,0.12);    }    .input-row input {      flex: 1; min-width: 0;      background: transparent; border: none; outline: none;      color: var(--white); font-family: 'DM Sans', sans-serif;      font-size: 0.92rem; padding: 0.85rem 1rem;      direction: ltr; text-align: left;    }    .input-row input::placeholder { color: rgba(250,250,250,0.3); }    .btn {      background: var(--orange); border: none; cursor: pointer;      color: #fff; font-weight: 700; font-size: 0.85rem;      padding: 0.85rem 1.2rem; white-space: nowrap;      transition: background 0.25s, transform 0.15s;      position: relative; overflow: hidden;      touch-action: manipulation;      flex-shrink: 0;    }    html[lang="ar"] .btn { font-family: 'Cairo', sans-serif; }    html[lang="en"] .btn { font-family: 'DM Sans', sans-serif; }    .btn::after {      content: ''; position: absolute; inset: 0;      background: rgba(255,255,255,0.15);      transform: translateX(-100%); transition: transform 0.3s;    }    .btn:hover { background: var(--orange-light); }    .btn:hover::after { transform: translateX(0); }    .btn:active { transform: scale(0.97); }
    /* Stacked form on very narrow screens */    @media (max-width: 400px) {      .input-row { flex-direction: column; border-radius: 12px; }      .btn { border-radius: 0 0 10px 10px; padding: 0.85rem; font-size: 0.9rem; }    }
    /* ── Success ── */    .success-msg {      display: none; align-items: center; justify-content: center;      gap: 10px; margin-top: 1rem;      color: var(--orange-light); font-size: 0.88rem; font-weight: 600;      text-align: center;    }    .success-msg.show { display: flex; animation: fadeUp 0.5s ease both; }    .check-icon {      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;      background: var(--orange-dim); border: 1.5px solid var(--orange);      display: flex; align-items: center; justify-content: center; font-size: 12px;    }
    /* ── Countdown ── */    .countdown {      display: flex; align-items: flex-start; justify-content: center;      flex-wrap: wrap; gap: 0.6rem 1.2rem;      margin-top: 2.5rem;      animation: fadeUp 0.9s 0.55s ease both;      width: 100%; max-width: 420px;    }    .cd-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }    .cd-num {      font-size: clamp(1.8rem, 8vw, 3rem); font-weight: 900;      color: var(--white); line-height: 1;      min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums;    }    .cd-label {      font-size: 0.6rem; font-weight: 600; letter-spacing: 0.1em;      color: rgba(250,250,250,0.35); text-transform: uppercase;    }    .cd-sep {      font-size: clamp(1.6rem, 5vw, 2.5rem); font-weight: 300;      color: rgba(247,146,30,0.4); align-self: flex-start; padding-top: 2px;      line-height: 1;    }
    /* ── Divider ── */    .divider {      width: 60px; height: 2px;      background: linear-gradient(90deg, transparent, var(--orange), transparent);      margin: 2rem auto 0;      animation: fadeUp 0.9s 0.65s ease both;    }
    /* ── Footer — part of flow, not fixed ── */    footer {      width: 100%; text-align: center;      font-size: 0.7rem; color: rgba(250,250,250,0.2);      letter-spacing: 0.05em;      padding: 2rem 1rem 0;      animation: fadeUp 1s 0.8s ease both;    }    footer span { color: rgba(247,146,30,0.5); }
    /* ── Lang-switch fade ── */    .fade-target { transition: opacity 0.2s ease; }    .fade-target.out { opacity: 0; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
    /* ── Tablet tweaks ── */    @media (max-width: 600px) {      .page { padding-top: 4.5rem; padding-bottom: 2.5rem; }      .sub br { display: none; }    }  </style></head><body>
<div class="bg"></div><div class="orb orb1"></div><div class="orb orb2"></div>
<!-- Language Switcher --><div class="lang-switcher">  <button class="lang-btn active" id="btn-ar" onclick="setLang('ar')">العربية</button>  <button class="lang-btn"        id="btn-en" onclick="setLang('en')">English</button></div>
<main class="page">
  <div class="logo-wrap">    <img src="./IMG_1170.PNG" alt="Gemy Pharmacies / صيدليات جيمي"/>  </div>
  <div class="badge">    <span class="badge-dot"></span>    <span class="fade-target" id="badge-text">قريباً · Coming Soon</span>  </div>
  <h1 class="fade-target" id="headline">موقعنا في <span>الطريق إليك</span></h1>
  <p class="sub fade-target" id="subtext">    نعمل على تطوير تجربة صحية استثنائية لك.<br/>    سجّل بريدك الإلكتروني لتكون أول من يعلم عند الإطلاق.  </p>
  <div class="form-wrap">    <form id="newsletterForm" action="https://formspree.io/f/mwlvkjwd" method="POST">    <div class="input-row">      <input type="email" name="email" id="emailInput" placeholder="example@email.com" autocomplete="email" required/>      <button type="submit" class="btn fade-target" id="cta-btn" onclick="subscribe(event)">أخبرني عند الإطلاق</button>    </div>    </form>    <div class="success-msg" id="successMsg">      <div class="check-icon">✓</div>      <span id="success-text">شكراً! سنُخطرك عند الإطلاق.</span>    </div>  </div>
  <div class="countdown">    <div class="cd-item">      <span class="cd-num" id="cd-days">00</span>      <span class="cd-label fade-target" id="lbl-days">أيام</span>    </div>    <div class="cd-sep">:</div>    <div class="cd-item">      <span class="cd-num" id="cd-hours">00</span>      <span class="cd-label fade-target" id="lbl-hours">ساعات</span>    </div>    <div class="cd-sep">:</div>    <div class="cd-item">      <span class="cd-num" id="cd-mins">00</span>      <span class="cd-label fade-target" id="lbl-mins">دقائق</span>    </div>    <div class="cd-sep">:</div>    <div class="cd-item">      <span class="cd-num" id="cd-secs">00</span>      <span class="cd-label fade-target" id="lbl-secs">ثواني</span>    </div>  </div>
  <div class="divider"></div>
  <footer id="footer-text">    © 2026 <span>صيدليات جيمي</span> · Gemy Pharmacies · جميع الحقوق محفوظة  </footer>
</main>
<script>  const strings = {    ar: {      badge:   'قريباً · Coming Soon',      h1:      'موقعنا في <span>الطريق إليك</span>',      sub:     'نعمل على تطوير تجربة صحية استثنائية لك.<br/>سجّل بريدك الإلكتروني لتكون أول من يعلم عند الإطلاق.',      cta:     'أخبرني عند الإطلاق',      success: 'شكراً! سنُخطرك عند الإطلاق.',      days:    'أيام', hours: 'ساعات', mins: 'دقائق', secs: 'ثواني',      footer:  '© 2026 <span>صيدليات جيمي</span> · Gemy Pharmacies · جميع الحقوق محفوظة',      title:   'صيدليات جيمي – قريباً',    },    en: {      badge:   'Coming Soon',      h1:      'We\'re <span>Almost Ready</span>',      sub:     'We\'re crafting an exceptional healthcare experience.<br/>Enter your email to be the first to know when we launch.',      cta:     'Notify Me at Launch',      success: 'Thank you! We\'ll notify you at launch.',      days:    'Days', hours: 'Hours', mins: 'Minutes', secs: 'Seconds',      footer:  '© 2026 <span>Gemy Pharmacies</span> · صيدليات جيمي · All rights reserved',      title:   'Gemy Pharmacies – Coming Soon',    }  };
  let lang = 'ar';
  function setLang(newLang) {    if (newLang === lang) return;    lang = newLang;    const targets = document.querySelectorAll('.fade-target');    targets.forEach(el => el.classList.add('out'));
    setTimeout(() => {      const s = strings[lang];      document.documentElement.lang = lang;      document.documentElement.dir  = lang === 'ar' ? 'rtl' : 'ltr';      document.title = s.title;
      document.getElementById('badge-text').innerHTML      = s.badge;      document.getElementById('headline').innerHTML        = s.h1;      document.getElementById('subtext').innerHTML         = s.sub;      document.getElementById('cta-btn').textContent      = s.cta;      document.getElementById('success-text').textContent = s.success;      document.getElementById('lbl-days').textContent     = s.days;      document.getElementById('lbl-hours').textContent    = s.hours;      document.getElementById('lbl-mins').textContent     = s.mins;      document.getElementById('lbl-secs').textContent     = s.secs;      document.getElementById('footer-text').innerHTML    = s.footer;
      document.getElementById('btn-ar').classList.toggle('active', lang === 'ar');      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      targets.forEach(el => el.classList.remove('out'));    }, 220);  }
  /* ── Countdown ── */  const launchTarget = new Date();  launchTarget.setDate(launchTarget.getDate() + 90);  const pad = n => String(n).padStart(2, '0');
  function tick() {    const diff = launchTarget - Date.now();    if (diff <= 0) { document.querySelector('.countdown').style.display = 'none'; return; }    document.getElementById('cd-days').textContent  = pad(Math.floor(diff / 86400000));    document.getElementById('cd-hours').textContent = pad(Math.floor((diff % 86400000) / 3600000));    document.getElementById('cd-mins').textContent  = pad(Math.floor((diff % 3600000) / 60000));    document.getElementById('cd-secs').textContent  = pad(Math.floor((diff % 60000) / 1000));  }  tick(); setInterval(tick, 1000);

 /* ── Subscribe ── */  function subscribe(e) {    if (e) e.preventDefault();
    const input = document.getElementById('emailInput');    const val = input.value.trim();    const form = document.getElementById('newsletterForm');

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {        input.style.outline = '2px solid #e05555';        setTimeout(() => input.style.outline = '', 1200);        return;    }

    fetch(form.action, {        method: "POST",        headers: {            'Accept': 'application/json',            'Content-Type': 'application/json'        },        body: JSON.stringify({ email: val })    })    .then(response => {        if (response.ok) {            input.value = '';            const msg = document.getElementById('successMsg');            msg.classList.add('show');            setTimeout(() => msg.classList.remove('show'), 5000);        } else {            alert(lang === 'ar' ? "حدث خطأ، حاول مرة أخرى." : "An error occurred. Please try again.");        }    })    .catch(() => alert(lang === 'ar' ? "حدث خطأ، حاول مرة أخرى." : "An error occurred. Please try again."));}
document.getElementById('emailInput').addEventListener('keydown', e => {    if (e.key === 'Enter') subscribe(e);});</script></body></html>
